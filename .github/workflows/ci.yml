name: CI

on:
  push:
    branches: [main]
  pull_request:

# a new push to a pull request supersedes the runs still going for it
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p rdoxide
      - name: Dependency licenses
        run: python tools/check_licenses.py

  # One wheel for everything: the extension uses the stable ABI (abi3-py310),
  # so the same file installs on every supported Python.
  wheel:
    name: Build wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # also keep the artifacts of the workspace crates, so that the
          # incremental build only recompiles what changed
          cache-workspace-crates: true
      - name: Build wheel (quick CI profile)
        uses: PyO3/maturin-action@v1
        env:
          CARGO_INCREMENTAL: "1"
        with:
          args: --profile ci --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    needs: wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: actions/download-artifact@v8
        with:
          name: wheel-${{ matrix.os }}
          path: dist
      - name: Install and test
        shell: bash
        run: |
          python -m pip install pytest numpy pillow
          python -m pip install --no-index --find-links dist rdoxide
          python -m pytest tests/python

  upstream-ratchet:
    name: Upstream RDKit test-suite (ratchet)
    needs: wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python tools/sync_upstream.py fetch
      - name: Check data tables are up to date with upstream
        run: |
          python tools/sync_upstream.py regen
          git diff --exit-code
      - run: python tools/sync_upstream.py diff
      - uses: actions/download-artifact@v8
        with:
          name: wheel-ubuntu-latest
          path: dist
      - name: Install
        run: |
          python -m pip install uv
          uv pip install --system pytest numpy pandas pillow ipython matplotlib scikit-learn tqdm
          uv pip install --system --no-index --find-links dist rdoxide
      - run: python tools/run_upstream_tests.py -v

  # On main only: the fat-LTO release build that gets shipped, to catch
  # problems that only show up with it.
  release-wheel:
    name: Release wheel (fat LTO)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist
      - name: Install and test
        run: |
          python -m pip install pytest numpy pillow
          python -m pip install --no-index --find-links dist rdoxide
          python -m pytest tests/python
