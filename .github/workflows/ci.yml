name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows runners disabled for now; restore to re-enable:
        # os: [ubuntu-latest, macos-latest, windows-latest]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p rdoxide
      - name: Dependency licenses
        run: python3 tools/check_licenses.py

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows runners disabled for now; restore to re-enable:
        # os: [ubuntu-latest, macos-latest, windows-latest]
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist
      - name: Install and test
        shell: bash
        run: |
          python -m pip install pytest numpy
          python -m pip install --no-index --find-links dist rdoxide
          python -m pytest tests/python

  upstream-ratchet:
    name: Upstream RDKit test-suite (ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python tools/sync_upstream.py fetch
      - name: Check data tables are up to date with upstream
        run: |
          python tools/sync_upstream.py regen
          git diff --exit-code
      - run: python tools/sync_upstream.py diff
      - name: Build and install
        run: |
          python -m pip install maturin pytest numpy
          maturin build --release --out dist
          python -m pip install --no-index --find-links dist rdoxide
      - run: python tools/run_upstream_tests.py -v
