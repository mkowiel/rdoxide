[package]
name = "rdoxide"
description = "Pure-Rust port of the RDKit cheminformatics toolkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
include = ["src/**", "data/**"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "png-format"], optional = true }

[lints]
workspace = true

[dev-dependencies]
serde_json = "1"

[features]
default = ["png"]
# PNG output of the molecule drawer (rasterises the drawer's SVG with tiny-skia)
png = ["dep:tiny-skia"]
