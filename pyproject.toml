[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "rdoxide"
description = "RDKit, rusted: a pure-Rust drop-in replacement for the RDKit Python API"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause AND BSD-2-Clause AND MIT AND Apache-2.0 AND Apache-2.0 WITH LLVM-exception AND MPL-2.0 AND BSL-1.0 AND OFL-1.1 AND LicenseRef-PublicDomain"
license-files = ["LICENSE", "LICENSES/*", "NOTICE"]
authors = [{ name = "Marcin Kowiel" }]
keywords = ["chemistry", "cheminformatics", "rdkit", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = ["numpy"]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=8"]
pandas = ["pandas"]

[project.urls]
Homepage = "https://github.com/mkowiel/rdoxide"
Repository = "https://github.com/mkowiel/rdoxide"
Changelog = "https://github.com/mkowiel/rdoxide/blob/main/CHANGELOG.md"
Issues = "https://github.com/mkowiel/rdoxide/issues"

[tool.maturin]
python-source = "python"
module-name = "rdoxide._rdoxide"
manifest-path = "crates/rdoxide-python/Cargo.toml"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 100
extend-exclude = ["python/rdoxide/upstream_*", "upstream"]
