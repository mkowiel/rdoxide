[workspace]
resolver = "3"
members = ["crates/rdoxide", "crates/rdoxide-python"]

[workspace.package]
version = "2026.9.1-alpha.0"
edition = "2024"
rust-version = "1.85"
license = "BSD-3-Clause AND BSD-2-Clause AND MIT AND Apache-2.0 AND Apache-2.0 WITH LLVM-exception AND MPL-2.0 AND BSL-1.0 AND OFL-1.1 AND LicenseRef-PublicDomain"
repository = "https://github.com/mkowiel/rdoxide"
authors = ["Marcin Kowiel", "RDKit contributors (upstream C++ code this project is ported from)"]

[workspace.dependencies]
rdoxide = { path = "crates/rdoxide", version = "2026.9.1-alpha.0" }
pyo3 = { version = "0.29", features = ["abi3-py310", "multiple-pymethods"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Ported algorithms keep upstream's index-based loops and signatures so they
# can be diffed against new RDKit releases line by line.
needless_range_loop = "allow"
too_many_arguments = "allow"
collapsible_if = "allow"
collapsible_else_if = "allow"
if_same_then_else = "allow"
map_entry = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"

# Pull-request CI: the same code as `release` (no debug assertions, overflow
# checks off) but quick to build, and incremental so that a cached target
# directory only recompiles what changed.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
