[workspace]
resolver = "3"
members = ["crates/rdoxide", "crates/rdoxide-python"]

[workspace.package]
version = "2026.9.1"
edition = "2024"
rust-version = "1.85"
license = "MIT AND BSD-3-Clause"
repository = "https://github.com/mkowiel/rdoxide"
authors = ["Marcin Kowiel", "RDKit contributors (upstream C++ code this project is ported from)"]

[workspace.dependencies]
rdoxide = { path = "crates/rdoxide", version = "2026.9.1" }
pyo3 = { version = "0.29", features = ["abi3-py310", "extension-module"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
